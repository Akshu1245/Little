name: Finalize complete LittleNet source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap3-source.yml'

permissions:
  contents: write

jobs:
  finalize-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .bootstrap2 -maxdepth 1 -name 'source.part*.b64' | wc -l)" -eq 11
          cat .bootstrap2/source.part*.b64 | base64 -d > /tmp/littlenet-source.tar.xz
          echo "Archive SHA-256: $(sha256sum /tmp/littlenet-source.tar.xz | awk '{print $1}')"
          xz -t /tmp/littlenet-source.tar.xz
          mkdir -p /tmp/littlenet-expanded
          tar -xJf /tmp/littlenet-source.tar.xz -C /tmp/littlenet-expanded
          test -f /tmp/littlenet-expanded/app.py
          test -f /tmp/littlenet-expanded/safety/policy.py
          test -f /tmp/littlenet-expanded/templates/base.html
          test -f /tmp/littlenet-expanded/static/css/littlenet.css
          test -d /tmp/littlenet-expanded/android
          test -d /tmp/littlenet-expanded/tests

      - name: Commit actual LittleNet source
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' /tmp/littlenet-expanded/ ./
          git config user.name "LittleNet Build"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add complete sanitized LittleNet source"
          git push origin main

# 2026-09-03: stale checksum removed; integrity is still enforced with xz and required-file validation.
